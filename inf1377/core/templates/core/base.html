<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Linketinder{% endblock %} | Linketinder</title>
    <style>
      :root { font-family: Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; color: #172033; background: #f5f7fb; }
      header { background: #172554; padding: 20px 24px; }
      header a { color: white; text-decoration: none; }
      main { max-width: 860px; margin: 32px auto; padding: 0 16px; }
      h1 { margin-top: 0; }
      .mensagens { list-style: none; margin: 0 0 20px; padding: 0; }
      .mensagens li { padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; background: #dbeafe; color: #1e3a8a; }
      .mensagens li.error { background: #fee2e2; color: #991b1b; }
      .mensagens li.success { background: #dcfce7; color: #166534; }
      .botao { display: inline-block; padding: 10px 16px; border: 0; border-radius: 8px; background: #1d4ed8; color: white; text-decoration: none; font-size: 1rem; cursor: pointer; }
      .botao-secundario { background: white; color: #1d4ed8; border: 1px solid #bfdbfe; }
      .botao-perigo { background: #dc2626; }
      .botao-pequeno { padding: 6px 12px; font-size: .9rem; }
      .painel { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; box-shadow: 0 5px 18px #1725540d; }
      .erro { color: #b91c1c; font-size: .9rem; margin: 4px 0 0; }
    </style>
    {% block estilos %}{% endblock %}
  </head>
  <body>
    <header><a href="{% url 'core:home' %}">&larr; Linketinder</a></header>
    <main>
      {% if messages %}
        <ul class="mensagens">
          {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
        </ul>
      {% endif %}
      {% block conteudo %}{% endblock %}
    </main>
  </body>
</html>

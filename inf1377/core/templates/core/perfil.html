<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meu Perfil | Linketinder</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 36px 24px; color: #172033; background: #f5f7fb; font: 16px Arial, sans-serif; }
      .card { width: min(100%, 700px); margin: auto; padding: 38px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 12px 35px #17255414; }
      .brand, a { color: #1d4ed8; text-decoration: none; }
      .brand { font-weight: bold; }
      h1 { margin: 22px 0 8px; color: #172554; }
      .intro { margin: 0 0 26px; color: #64748b; }
      form p { display: flex; flex-direction: column; gap: 7px; margin: 16px 0; }
      label { font-weight: bold; color: #334155; }
      input, textarea, select { width: 100%; padding: 12px 13px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
      textarea { min-height: 110px; resize: vertical; }
      input:focus, textarea:focus, select:focus { outline: 3px solid #bfdbfe; border-color: #2563eb; }
      .errorlist { margin: 4px 0 0; padding: 0; color: #b91c1c; list-style: none; font-size: .9rem; }
      button { width: 100%; margin-top: 12px; padding: 13px; border: 0; border-radius: 8px; color: white; background: #1d4ed8; font-weight: bold; font-size: 1rem; cursor: pointer; }
      button:hover { background: #1e40af; }
      .links { display: flex; justify-content: space-between; gap: 16px; margin-top: 22px; }
      @media (max-width: 520px) { .card { padding: 26px 20px; } .links { flex-direction: column; text-align: center; } }
    </style>
  </head>
  <body>
    <main class="card">
      <a class="brand" href="{% url 'core:home' %}">Linketinder</a>
      <h1>Meu Perfil</h1>
      <p class="intro">Atualize seus dados profissionais. Deixe os campos de senha vazios para mantê-la.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit">Salvar alterações</button>
      </form>
      <div class="links">
        <a href="{% url 'core:home' %}">← Voltar para a home</a>
        <a href="{% url 'core:logout' %}">Sair da conta</a>
      </div>
    </main>
  </body>
</html>

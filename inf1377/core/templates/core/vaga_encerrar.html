<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Encerrar vaga | Linketinder</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 36px 24px; color: #172033; background: #f5f7fb; font: 16px Arial, sans-serif; }
      .card { width: min(100%, 560px); margin: auto; padding: 38px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 12px 35px #17255414; }
      .brand, a { color: #1d4ed8; text-decoration: none; }
      .brand { font-weight: bold; }
      h1 { margin: 22px 0 12px; color: #172554; }
      p { color: #475569; line-height: 1.55; }
      .aviso { padding: 14px; border-radius: 8px; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; }
      .acoes { display: flex; gap: 12px; margin-top: 24px; }
      .acoes > * { flex: 1; padding: 13px; border-radius: 8px; text-align: center; font: bold 1rem Arial, sans-serif; }
      button { border: 0; color: white; background: #dc2626; cursor: pointer; }
      button:hover { background: #b91c1c; }
      .cancelar { background: #eff6ff; }
    </style>
  </head>
  <body>
    <main class="card">
      <a class="brand" href="{% url 'core:home' %}">Linketinder</a>
      <h1>Encerrar “{{ vaga.nome }}”?</h1>
      <p>A vaga sai do feed dos candidatos e não poderá ser reativada. Os matches já feitos para ela continuam valendo.</p>
      <p class="aviso">Esta ação não pode ser desfeita.</p>
      <form method="post" class="acoes">
        {% csrf_token %}
        <a class="cancelar" href="{% url 'core:minhas-vagas' %}">Cancelar</a>
        <button type="submit">Encerrar vaga</button>
      </form>
    </main>
  </body>
</html>

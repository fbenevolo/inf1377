{% for match in matches_novos %}
  <div role="status" style="margin: 16px 0; padding: 16px; border: 1px solid #86efac; border-radius: 12px; background: #f0fdf4; color: #166534; text-align: center;">
    <strong>Deu match!</strong>
    {% if request.session.tipo_conta == "empresa" %}
      Você e {{ match.candidato.nome }} demonstraram interesse.
    {% else %}
      Você e {{ match.empresa.nome }} demonstraram interesse.
    {% endif %}
  </div>
{% endfor %}
